volumes:
  postgres_data:
  
networks:
  rapidgo-net:
    driver: bridge

services:
  # ==========================================
  # CAPA 1: KAFKA (Streaming Ingestion)
  # ==========================================
  kafka:
    image: apache/kafka:4.3.1        
    container_name: rg-kafka
    networks:
      - rapidgo-net
    ports:
      - "9092:9092"                    # Acceso para el productor local en Python
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:                           # Crea automáticamente el topic de seguridad
    image: apache/kafka:4.3.1
    container_name: rg-kafka-init
    networks:
      - rapidgo-net
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic driver_security_events --partitions 3 --replication-factor 1
    restart: "no"

  # ==========================================
  # CAPA 2: AIRFLOW (Orquestación - Semana 3)
  # ==========================================
  postgres:
    image: postgres:15
    container_name: rg-postgres
    networks:
      - rapidgo-net
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: rg-airflow-webserver
    networks:
      - rapidgo-net
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      &airflow-env
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./datalake:/opt/airflow/datalake
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: rg-airflow-scheduler
    networks:
      - rapidgo-net
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./datalake:/opt/airflow/datalake
    command: scheduler