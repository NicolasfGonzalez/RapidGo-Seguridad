volumes:
  postgres_data:
  kafka_data:

networks:
  rapidgo-net:
    driver: bridge

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__WEBSERVER__SECRET_KEY: 'rapidgo_clave_secreta_123'

services:
  kafka:
    image: apache/kafka:4.3.1   # verifica que este tag exista
    container_name: rg-kafka
    networks:
      - rapidgo-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092   # <-- FIX
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: rg-kafka-init
    networks:
      - rapidgo-net
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic driver_security_events --partitions 3 --replication-factor 1
    restart: "no"

  spark-consumer:
    image: apache/spark:3.5.3
    container_name: rg-spark-consumer
    user: root
    networks:
      - rapidgo-net
    volumes:
      - .:/opt/app
    working_dir: /opt/app
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully   # <-- FIX
    command: >
      /opt/spark/bin/spark-submit
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      spark/streaming_consumer.py

  postgres:
    image: postgres:15
    container_name: rg-postgres
    networks:
      - rapidgo-net
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:                                      # <-- NUEVO
    image: apache/airflow:2.8.1-python3.11
    container_name: rg-airflow-init
    networks:
      - rapidgo-net
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow-env
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --no-cache-dir pandas numpy pyarrow
        airflow db migrate &&
        (airflow users create --username admin --password admin \
          --firstname Admin --lastname RapidGo --role Admin \
          --email admin@rapidgo.local || true)
    restart: "no"

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: rg-airflow-webserver
    networks:
      - rapidgo-net
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./datalake:/opt/airflow/datalake
      - ./airflow/logs:/opt/airflow/logs
    command: >
      bash -c "pip install --no-cache-dir pandas numpy pyarrow &&
           airflow webserver"

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: rg-airflow-scheduler
    networks:
      - rapidgo-net
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./datalake:/opt/airflow/datalake
      - ./airflow/logs:/opt/airflow/logs
    command: >
      bash -c "pip install --no-cache-dir pandas numpy pyarrow &&
           airflow scheduler"